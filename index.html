<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro MultiView Dashboard - 20 MultiView & Auto Reboot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Top Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-[1920px] mx-auto flex flex-col lg:flex-row items-center justify-between gap-4">
            
            <!-- Branding & Status -->
            <div class="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30">
                        <i class="fa-solid fa-grid-2 text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg tracking-wide text-white">MultiView Pro 20</h1>
                        <p class="text-xs text-slate-400">20-Screen Synchronized Dashboard</p>
                    </div>
                </div>
                <!-- Mobile Timer Badge -->
                <div id="mobile-timer-badge" class="lg:hidden flex items-center gap-1.5 bg-slate-800 px-3 py-1.5 rounded-full text-xs font-mono text-indigo-400 border border-slate-700">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span id="mobile-countdown">--s</span>
                </div>
            </div>

            <!-- Master Control & URL Bar -->
            <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-center">
                <div class="relative flex-1 lg:w-96">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-link"></i>
                    </span>
                    <input type="url" id="master-url" placeholder="https://example.com (Masukkan URL Global untuk 20 View)" 
                        class="w-full pl-9 pr-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
                </div>
                <button onclick="applyMasterUrl()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-indigo-600/20 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-paper-plane"></i> Terapkan (20)
                </button>
            </div>

            <!-- Global Actions & Timer -->
            <div class="flex items-center gap-3 w-full lg:w-auto justify-end">
                <!-- Layout Grid Columns Selector -->
                <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg p-1">
                    <span class="text-xs text-slate-400 px-2 font-medium hidden sm:inline"><i class="fa-solid fa-columns mr-1"></i> Kolom:</span>
                    <select id="grid-cols-select" onchange="changeGridColumns(this.value)" class="bg-slate-900 text-slate-200 text-xs px-2 py-1 rounded border-none focus:outline-none cursor-pointer">
                        <option value="2">2 Kolom</option>
                        <option value="3">3 Kolom</option>
                        <option value="4">4 Kolom</option>
                        <option value="5" selected>5 Kolom</option>
                    </select>
                </div>

                <!-- Timer Selector -->
                <div class="flex items-center bg-slate-950 border border-slate-700 rounded-lg p-1">
                    <span class="text-xs text-slate-400 px-2 font-medium hidden sm:inline"><i class="fa-solid fa-stopwatch mr-1"></i> Auto-Reboot:</span>
                    <select id="timer-select" onchange="changeTimer(this.value)" class="bg-slate-900 text-slate-200 text-xs px-2 py-1 rounded border-none focus:outline-none cursor-pointer">
                        <option value="0">Mati</option>
                        <option value="30">30 Detik</option>
                        <option value="60">60 Detik</option>
                        <option value="120">120 Detik</option>
                    </select>
                </div>

                <!-- Live Countdown -->
                <div class="hidden lg:flex items-center gap-1.5 bg-slate-800/80 px-3 py-1.5 rounded-lg text-xs font-mono text-indigo-400 border border-slate-700">
                    <i class="fa-solid fa-hourglass-half animate-pulse"></i>
                    <span id="desktop-countdown">Off</span>
                </div>

                <!-- Reboot All Button -->
                <button onclick="rebootAll()" title="Refresh Semua 20 Frame Sekaligus" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-emerald-600/20 flex items-center gap-1.5 cursor-pointer">
                    <i class="fa-solid fa-rotate"></i>
                    <span class="hidden sm:inline">Reboot Semua (20)</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Main Grid Container (20 Frames) -->
    <main class="flex-1 max-w-[1920px] w-full mx-auto p-4">
        <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-4">
            <!-- Dynamic 20 frames injected via JS -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-3 px-4 text-center text-xs text-slate-500">
        MultiView Pro 20 Dashboard &copy; 2026 &bull; Synchronized Multi-Screen Monitoring
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const TOTAL_FRAMES = 20;
        let countdownInterval = null;
        let timeRemaining = 0;
        let activeTimerSetting = 0;

        // Initialize Grid on Load
        document.addEventListener('DOMContentLoaded', () => {
            renderGridFrames();
        });

        function renderGridFrames() {
            const container = document.getElementById('grid-container');
            let html = '';
            for (let i = 1; i <= TOTAL_FRAMES; i++) {
                html += `
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-lg flex flex-col h-[320px] sm:h-[350px] group transition hover:border-slate-700">
                    <!-- Frame Header -->
                    <div class="bg-slate-900 px-2.5 py-2 border-b border-slate-800 flex items-center justify-between gap-1.5">
                        <div class="flex items-center gap-1.5 overflow-hidden w-full">
                            <span class="bg-indigo-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0">#${i}</span>
                            <input type="text" id="url-input-${i}" placeholder="https://..." onkeydown="handleUrlKey(event, ${i})"
                                class="bg-slate-950 border border-slate-700 text-xs text-slate-200 px-2 py-1 rounded w-full focus:outline-none focus:ring-1 focus:ring-indigo-500 transition">
                        </div>
                        <div class="flex items-center gap-0.5 shrink-0">
                            <button onclick="loadFrameUrl(${i})" title="Load URL" class="text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800 transition">
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                            <button onclick="refreshFrame(${i})" title="Reboot Frame" class="text-slate-400 hover:text-emerald-400 p-1 rounded hover:bg-slate-800 transition">
                                <i class="fa-solid fa-rotate-right text-xs"></i>
                            </button>
                            <button onclick="toggleFullscreen(${i})" title="Fullscreen" class="text-slate-400 hover:text-indigo-400 p-1 rounded hover:bg-slate-800 transition">
                                <i class="fa-solid fa-expand text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Frame Body -->
                    <div class="flex-1 relative bg-slate-950" id="frame-wrapper-${i}">
                        <iframe id="frame-${i}" src="about:blank" class="w-full h-full border-none" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
                        <div id="placeholder-${i}" class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 p-3 text-center pointer-events-none">
                            <i class="fa-solid fa-globe text-2xl mb-1.5 opacity-40"></i>
                            <p class="text-xs font-medium">Slot #${i}</p>
                        </div>
                    </div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function changeGridColumns(cols) {
            const container = document.getElementById('grid-container');
            container.className = `grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-${cols} gap-4`;
        }

        function formatUrl(url) {
            url = url.trim();
            if (!url) return '';
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                return 'https://' + url;
            }
            return url;
        }

        function loadFrameUrl(id) {
            const input = document.getElementById(`url-input-${id}`);
            const frame = document.getElementById(`frame-${id}`);
            const placeholder = document.getElementById(`placeholder-${id}`);
            let url = formatUrl(input.value);

            if (url) {
                frame.src = url;
                placeholder.style.display = 'none';
                input.value = url;
            } else {
                frame.src = 'about:blank';
                placeholder.style.display = 'flex';
            }
        }

        function handleUrlKey(event, id) {
            if (event.key === 'Enter') {
                loadFrameUrl(id);
            }
        }

        function applyMasterUrl() {
            const masterInput = document.getElementById('master-url');
            let url = formatUrl(masterInput.value);
            if (!url) {
                alert('Silakan masukkan URL global terlebih dahulu.');
                return;
            }

            for (let i = 1; i <= TOTAL_FRAMES; i++) {
                const input = document.getElementById(`url-input-${i}`);
                input.value = url;
                loadFrameUrl(i);
            }
        }

        function refreshFrame(id) {
            const frame = document.getElementById(`frame-${id}`);
            const currentSrc = frame.src;
            if (currentSrc && currentSrc !== 'about:blank') {
                frame.src = 'about:blank';
                setTimeout(() => {
                    frame.src = currentSrc;
                }, 100);
            }
        }

        function rebootAll() {
            for (let i = 1; i <= TOTAL_FRAMES; i++) {
                refreshFrame(i);
            }
            resetTimer();
        }

        function toggleFullscreen(id) {
            const wrapper = document.getElementById(`frame-wrapper-${id}`);
            if (!document.fullscreenElement) {
                if (wrapper.requestFullscreen) {
                    wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    wrapper.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function changeTimer(val) {
            activeTimerSetting = parseInt(val, 10);
            resetTimer();
        }

        function resetTimer() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            if (activeTimerSetting <= 0) {
                document.getElementById('desktop-countdown').innerText = 'Off';
                document.getElementById('mobile-countdown').innerText = 'Off';
                return;
            }

            timeRemaining = activeTimerSetting;
            updateCountdownDisplay();

            countdownInterval = setInterval(() => {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    rebootAll();
                } else {
                    updateCountdownDisplay();
                }
            }, 1000);
        }

        function updateCountdownDisplay() {
            const text = `${timeRemaining}s`;
            document.getElementById('desktop-countdown').innerText = text;
            document.getElementById('mobile-countdown').innerText = text;
        }
    </script>
</body>
</html>
